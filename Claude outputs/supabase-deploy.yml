# Deploys Supabase changes when they're pushed to main:
#  - new/changed SQL files in supabase/migrations are run against the database
#  - changed edge functions in supabase/functions are deployed
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   (optional) project ref, e.g. abcdefghijklmnop — looked up by name "the-lantern" if missing
#
# You can also run it by hand: Actions → "Deploy Supabase" → Run workflow.

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy (space-separated, or 'all')"
        default: "interview-turn interview-finish interview-admin"
      migrations:
        description: "Migration files to run (space-separated paths), optional"
        default: ""

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PROJECT_NAME: the-lantern
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repo secret"; exit 1; fi
          if [ -z "$PROJECT_REF" ]; then
            PROJECT_REF=$(curl -sf https://api.supabase.com/v1/projects -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | jq -r --arg n "$PROJECT_NAME" '[.[] | select(.name == $n)][0].id // empty')
          fi
          if [ -z "$PROJECT_REF" ]; then echo "::error::Could not find a Supabase project named $PROJECT_NAME"; exit 1; fi
          echo "PROJECT_REF=$PROJECT_REF" >> "$GITHUB_ENV"
          echo "Deploying to project $PROJECT_REF"

      - name: Work out what changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MIGRATIONS=${{ github.event.inputs.migrations }}" >> "$GITHUB_ENV"
            FN="${{ github.event.inputs.functions }}"
            if [ "$FN" = "all" ]; then FN=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_' | tr '\n' ' '); fi
            echo "FUNCTIONS=$FN" >> "$GITHUB_ENV"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD)
          echo "Changed files:"; echo "$CHANGED"
          MIG=$(echo "$CHANGED" | grep '^supabase/migrations/.*\.sql$' | sort | tr '\n' ' ' || true)
          FN=$(echo "$CHANGED" | grep '^supabase/functions/' | cut -d/ -f3 | sort -u | grep -v '^_' | tr '\n' ' ' || true)
          # Shared code changed → redeploy every function that imports it.
          if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
            FN="$FN $(grep -l '_shared/' supabase/functions/*/index.ts | cut -d/ -f3 | tr '\n' ' ')"
          fi
          FN=$(echo $FN | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "MIGRATIONS=$MIG" >> "$GITHUB_ENV"
          echo "FUNCTIONS=$FN" >> "$GITHUB_ENV"

      - name: Run migrations
        if: env.MIGRATIONS != ''
        run: |
          for f in $MIGRATIONS; do
            [ -f "$f" ] || continue
            echo "Running $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/q.json)
            cat /tmp/out.json; echo
            if [ "$code" -ge 300 ]; then echo "::error::Migration $f failed ($code)"; exit 1; fi
          done

      - name: Deploy functions
        if: env.FUNCTIONS != ''
        run: |

          for fn in $FUNCTIONS; do
            [ -d "supabase/functions/$fn" ] || continue
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done

      - name: Check secrets the interviewer needs
        if: contains(env.FUNCTIONS, 'interview')
        run: |
          NAMES=$(curl -sf "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name')
          for s in ANTHROPIC_API_KEY ELEVENLABS_API_KEY GITHUB_TOKEN GITHUB_REPO; do
            if echo "$NAMES" | grep -qx "$s"; then echo "✓ $s is set"; else echo "::warning::Edge function secret $s is missing"; fi
          done
